server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cbc-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cbc_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          "[time_zone]": Africa/Ouagadougou

  jackson:
    time-zone: Africa/Ouagadougou
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          ssl:
            checkserveridentity: true

# Configuration JWT & Sécurité CBC
application:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      matricule: ${BOOTSTRAP_ADMIN_MATRICULE:ADM001}
      nom: ${BOOTSTRAP_ADMIN_NOM:ADMIN}
      prenom: ${BOOTSTRAP_ADMIN_PRENOM:SONAGESS}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      telephone: ${BOOTSTRAP_ADMIN_TELEPHONE:}
      mot-de-passe: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:d3Zhd1BqM3BScW5oenRZd3Bhc2RmM2doampzbGtkZmoxMjM0NTY3ODkwMQ==}
      access-token-expiration: 86400000 # 24 heures
      refresh-token-expiration: 604800000 # 7 jours
    otp:
      expiration-minutes: 5
      max-attempts: 5
      demo-mode: ${OTP_DEMO_MODE:false}
    max-login-attempts: 3
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

# Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Actuator monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
